name: SG-02 foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test
      - run: npm run build:functions

  dependency-audit:
    # Kept visible and failing while the known upstream Zod advisory is unresolved.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm audit
