[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc = "0.8.28"
offline = true
auto_detect_solc = false
evm_version = "cancun"
chain_id = 8453
optimizer = true
optimizer_runs = 200
# Avoid SOL-2026-7 in the installed compiler; keep auditable legacy code generation.
optimizer_details = { yul = false }
extra_output = ["storageLayout"]
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["EndpointRegistry"]

[profile.default.fuzz]
runs = 512
seed = "0x8453"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 110
